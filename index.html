        // Методы pop/push, shift/unshift

        let fruits2 =["Apple", "Banana", "Orange", "Orange1"]
        console.log(fruits2);

        //push() - добавляеет элемент в конец массива
        fruits2.push("Kiwi")
        console.log(fruits2);


        // pop() - удаляет с конца
        fruits2.pop()
        console.log(fruits2);
        
        
        //unshift() - добавляет в начало элемент
        fruits2.unshift("Kiwi")
        console.log(fruits2);

        //shift() - удаляет в начале элемент
        fruits2.shift
        console.log(fruits2);
        
        fruits2.push("mercedes")
        console.log(fruits2);
